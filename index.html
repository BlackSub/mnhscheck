            </div>

        db.ref('librarySeats').on('value', (snapshot) => {
            const data = snapshot.val() || {};
            
            for (let key in libraryData) {
                libraryData[key].seats = new Array(libraryData[key].seatLabels.length).fill(null);
                if (data[key]) {
                    for (let index in data[key]) {
                        libraryData[key].seats[index] = data[key][index];
                    }
                }
            }
            
            if (currentSpace.startsWith('list')) {
                renderList(currentSpace.replace('list-grade', ''));
            } else {
                renderSeats();
            }
            updatePanel();
        });

        function renderTabs() {
            tabContainer.innerHTML = '';
            
            for (let key in libraryData) {
                const btn = document.createElement('button');
                btn.className = 'tab-button';
                if (key === currentSpace) btn.classList.add('active');
                
                btn.innerText = libraryData[key].name;
                btn.onclick = () => {
                    currentSpace = key;
                    selectedSeatIndex = null;
                    updatePanel();
                    renderTabs();
                    renderSeats();
                };
                tabContainer.appendChild(btn);
            }

            const listTabs = [
                { id: 'list-grade2', name: '📋 2학년', gradePrefix: '2' },
                { id: 'list-grade1', name: '📋 1학년', gradePrefix: '1' },
                { id: 'list-grade3', name: '📋 3학년', gradePrefix: '3' }
            ];

            listTabs.forEach(tabInfo => {
                const listBtn = document.createElement('button');
                listBtn.className = 'tab-button list-tab-btn';
                if (currentSpace === tabInfo.id) listBtn.classList.add('active');
                listBtn.innerText = tabInfo.name;
                
                listBtn.onclick = () => {
                    if (!isTeacherAuthenticated) {
                        const code = prompt("선생님 전용 메뉴입니다.\n관리자 코드를 입력하세요:");
                        if (code === "96123") {
                            isTeacherAuthenticated = true;
                            alert("인증되었습니다.");
                        } else {
                            if (code !== null) alert("코드가 일치하지 않습니다.");
                            return; 
                        }
                    }

                    currentSpace = tabInfo.id;
                    selectedSeatIndex = null;
                    updatePanel();
                    renderTabs();
                    renderList(tabInfo.gradePrefix); 
                };
                tabContainer.appendChild(listBtn);
            });
        }

        function renderSeats() {
            seatContainer.innerHTML = ''; 
            seatContainer.style.display = 'grid'; 
            seatContainer.style.backgroundColor = 'var(--light-blue)';
            
            const layoutMap = libraryData[currentSpace].layout;
            const currentSeatData = libraryData[currentSpace].seats;
            const labels = libraryData[currentSpace].seatLabels;
            
            const colCount = layoutMap[0].length;
            seatContainer.style.gridTemplateColumns = `repeat(${colCount}, minmax(40px, 70px))`;

            // 창문 및 통로 표시
            if (['grade1', 'grade2', 'grade3', 'lounge'].includes(currentSpace)) {
                const windowDiv = document.createElement('div');
                windowDiv.className = 'window-indicator';
                windowDiv.style.gridColumn = `1 / span ${colCount}`;
                windowDiv.innerHTML = '🪟 창 문 🪟';
                seatContainer.appendChild(windowDiv);
            } else if (currentSpace === 'stand') {
                const aisleDiv = document.createElement('div');
                aisleDiv.className = 'aisle-indicator';
                aisleDiv.style.gridColumn = `1 / span ${colCount}`;
                aisleDiv.innerHTML = '🚶 통 로 🚶';
                seatContainer.appendChild(aisleDiv);
            }

            let currentSeatIndex = 0; 
            for (let r = 0; r < layoutMap.length; r++) {
                for (let c = 0; c < layoutMap[r].length; c++) {
                    const cellDiv = document.createElement('div');
                    cellDiv.classList.add('cell');

                    if (layoutMap[r][c] !== 0) {
                        cellDiv.classList.add('seat');
                        
                        if (currentSpace === 'grade3') {
                            cellDiv.classList.add('seat-yellow');
                        } else if (labels[currentSeatIndex].includes('남') || labels[currentSeatIndex].startsWith('M')) {
                            cellDiv.classList.add('seat-blue');
                        } else if (labels[currentSeatIndex].includes('여')) {
                            cellDiv.classList.add('seat-pink');
                        } else if (labels[currentSeatIndex].startsWith('W')) {
                            cellDiv.classList.add('seat-yellow');
                        }

                        if (currentSeatIndex === selectedSeatIndex) cellDiv.classList.add('selected');
                        
                        const seatIndex = currentSeatIndex; 
                        const seatNumber = document.createElement('div');
                        seatNumber.classList.add('seat-number');
                        seatNumber.innerText = labels[seatIndex]; 
                        cellDiv.appendChild(seatNumber);

                        if (currentSeatData[seatIndex]) {
                            cellDiv.classList.add('occupied');
                            const studentInfo = document.createElement('div');
                            studentInfo.classList.add('student-info');
                            studentInfo.innerHTML = `${currentSeatData[seatIndex].id}<br>${currentSeatData[seatIndex].name}`;
                            cellDiv.appendChild(studentInfo);
                        }
                        
                        cellDiv.onclick = () => {
                            selectedSeatIndex = seatIndex;
                            updatePanel();
                            renderSeats();
                            
                            if (window.innerWidth <= 1024) {
                                document.getElementById('panelSection').scrollIntoView({ behavior: 'smooth' });
                            }
                        };
                        currentSeatIndex++;
                    } else {
                        cellDiv.classList.add('empty-space');
                    }
                    seatContainer.appendChild(cellDiv);
                }
            }
        }

        function renderList(gradePrefix) {
            seatContainer.innerHTML = '';
            seatContainer.style.display = 'block'; 
            seatContainer.style.backgroundColor = 'transparent';

            let allStudents = [];
            
            for (let key in libraryData) {
                const areaName = libraryData[key].name;
                libraryData[key].seats.forEach((seat, index) => {
                    if (seat) {
                        let label = libraryData[key].seatLabels[index];
                        let displayLabel = String(label).includes('-') ? label : `${label}번`;
                        
                        let seatLoc = displayLabel.startsWith(areaName) ? displayLabel : `${areaName} ${displayLabel}`;
                        
                        allStudents.push({
                            id: String(seat.id),
                            name: seat.name,
                            displayLabel: displayLabel,
                            seatLocation: seatLoc,
                            remark: seat.remark || '', 
                            areaKey: key,
                            seatIndex: index
                        });
                    }
                });
            }

            let filteredStudents = allStudents.filter(student => student.id.startsWith(gradePrefix));
            
            filteredStudents.sort((a, b) => {
                if (a.areaKey !== b.areaKey) {
                    return a.areaKey.localeCompare(b.areaKey);
                }
                return a.displayLabel.localeCompare(b.displayLabel, 'ko', { numeric: true });
            });

            let summaryHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-left: 5px; flex-wrap: wrap; gap: 10px;">
                    <div style="font-size: 1.1em; font-weight: bold; color: #2e7d32;">
                        현재 자습 참여 인원 : 총 ${filteredStudents.length}명
                    </div>
                    <div style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                        <div class="study-period-selector">
                            <label><input type="radio" name="studyPeriod" value="오후자습" checked> 오후자습</label>
                            <label><input type="radio" name="studyPeriod" value="저녁자습"> 저녁자습</label>
                        </div>
                        <button class="btn btn-export" onclick="exportCSV('${gradePrefix}')">엑셀 다운로드</button>
                        <button class="btn btn-export btn-sheets" onclick="exportToGoogleSheet('${gradePrefix}')">구글 시트로 전송</button>
                    </div>
                </div>
            `;

            if (filteredStudents.length === 0) {
                seatContainer.innerHTML = summaryHTML + `<div class="empty-message">현재 등록된 ${gradePrefix}학년 학생이 없습니다.</div>`;
                return;
            }

            let tableHTML = '<div style="overflow-x: auto;"><table class="student-list-table">';
            tableHTML += '<tr><th style="min-width:60px;">학번</th><th style="min-width:60px;">이름</th><th style="min-width:110px;">위치</th><th style="min-width:150px;">비고</th></tr>';
            
            filteredStudents.forEach(student => {
                tableHTML += `<tr>
                                <td>${student.id}</td>
                                <td>${student.name}</td>
                                <td>${student.seatLocation}</td>
                                <td>
                                    <input type="text" class="remark-input" 
                                           value="${student.remark}" 
                                           placeholder="조기 귀가 등..." 
                                           onchange="updateRemark('${student.areaKey}', ${student.seatIndex}, this.value)">
                                </td>
                              </tr>`;
            });
            tableHTML += '</table></div>';
            
            seatContainer.innerHTML = summaryHTML + tableHTML;
        }

        function updateRemark(areaKey, seatIndex, value) {
            db.ref(`librarySeats/${areaKey}/${seatIndex}/remark`).set(value);
        }

        function exportCSV(gradePrefix) {
            let allStudents = [];
            for (let key in libraryData) {
                const areaName = libraryData[key].name;
                libraryData[key].seats.forEach((seat, index) => {
                    if (seat) {
                        let label = libraryData[key].seatLabels[index];
                        let displayLabel = String(label).includes('-') ? label : `${label}번`;
                        let seatLoc = displayLabel.startsWith(areaName) ? displayLabel : `${areaName} ${displayLabel}`;
                        allStudents.push({
                            id: String(seat.id), name: seat.name, displayLabel: displayLabel,
                            seatLocation: seatLoc, remark: seat.remark || '', areaKey: key, seatIndex: index
                        });
                    }
                });
            }

            let filteredStudents = allStudents.filter(student => student.id.startsWith(gradePrefix));
            filteredStudents.sort((a, b) => {
                if (a.areaKey !== b.areaKey) return a.areaKey.localeCompare(b.areaKey);
                return a.displayLabel.localeCompare(b.displayLabel, 'ko', { numeric: true });
            });

            if (filteredStudents.length === 0) {
                alert("다운로드할 데이터가 없습니다.");
                return;
            }

            const periodRadios = document.getElementsByName('studyPeriod');
            let selectedPeriod = "오후자습";
            for (let radio of periodRadios) {
                if (radio.checked) { selectedPeriod = radio.value; break; }
            }

            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const day = days[now.getDay()];
            
            const fullDateStr = `${year}년 ${month}월 ${date}일 (${day}요일)`;
            const fileDateStr = `${year}${month}${date}`;

            let csvContent = '\uFEFF'; 
            csvContent += `"${fullDateStr}","${selectedPeriod}","${gradePrefix}학년 자습명단"\n\n`;
            csvContent += '학번,이름,현재 좌석위치,비고\n';

            filteredStudents.forEach(student => {
                let remark = student.remark.replace(/"/g, '""'); 
                csvContent += `${student.id},${student.name},${student.seatLocation},"${remark}"\n`;
            });

            const fileName = `${fileDateStr}_${selectedPeriod}_${gradePrefix}학년_자습명단.csv`;
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            link.setAttribute('href', url);
            link.setAttribute('download', fileName);
            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 기존 1개 학년 수동 전송 기능
        function exportToGoogleSheet(gradePrefix) {
            let allStudents = [];
            for (let key in libraryData) {
                const areaName = libraryData[key].name;
                libraryData[key].seats.forEach((seat, index) => {
                    if (seat) {
                        let label = libraryData[key].seatLabels[index];
                        let displayLabel = String(label).includes('-') ? label : `${label}번`;
                        let seatLoc = displayLabel.startsWith(areaName) ? displayLabel : `${areaName} ${displayLabel}`;
                        allStudents.push({
                            id: String(seat.id), name: seat.name, displayLabel: displayLabel,
                            seatLocation: seatLoc, remark: seat.remark || '', areaKey: key, seatIndex: index
                        });
                    }
                });
            }

            let filteredStudents = allStudents.filter(student => student.id.startsWith(gradePrefix));
            filteredStudents.sort((a, b) => {
                if (a.areaKey !== b.areaKey) return a.areaKey.localeCompare(b.areaKey);
                return a.displayLabel.localeCompare(b.displayLabel, 'ko', { numeric: true });
            });

            if (filteredStudents.length === 0) {
                alert("전송할 데이터가 없습니다.");
                return;
            }

            const periodRadios = document.getElementsByName('studyPeriod');
            let selectedPeriod = "오후자습";
            for (let radio of periodRadios) {
                if (radio.checked) { selectedPeriod = radio.value; break; }
            }

            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            const fullDateStr = `${year}-${month}-${date}`;
            const timeStr = `${hours}:${minutes}:${seconds}`;

            const payload = {
                date: fullDateStr,
                time: timeStr,
                period: selectedPeriod,
                grade: `${gradePrefix}학년`,
                students: filteredStudents
            };

            alert("해당 학년 전송을 시작합니다.\n완료 알림이 뜰 때까지 잠시만 기다려주세요.");

            const sendBtn = event ? event.target : null;
            if (sendBtn) {
                sendBtn.disabled = true;
                sendBtn.innerText = "전송 중... ⏳";
                sendBtn.style.backgroundColor = "#777";
            }

            fetch(GOOGLE_SHEET_URL, {
                method: 'POST',
                mode: 'no-cors', 
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(payload)
            })
            .then(response => {
                alert(`✅ 구글 시트로 전송이 완료되었습니다!\n(전송 시각: ${timeStr})`);
            })
            .catch(error => {
                alert("네트워크 오류가 발생했습니다.\n" + error);
            })
            .finally(() => {
                if (sendBtn) {
                    sendBtn.disabled = false;
                    sendBtn.innerText = "구글 시트로 전송";
                    sendBtn.style.backgroundColor = "#0f9d58";
                }
            });
        }

        // 🌟 수정됨: 전체 학년 일괄 전송 (자동 전송 호환 기능 추가)
        function exportAllToGoogleSheet(isAuto = false, autoPeriod = null) {
            // 수동 클릭일 때만 인증 검사 수행
            if (!isAuto) {
                if (!isTeacherAuthenticated) {
                    const code = prompt("선생님 전용 메뉴입니다.\n관리자 코드를 입력하세요:");
                    if (code === "96123") {
                        isTeacherAuthenticated = true;
                        alert("인증되었습니다.");
                    } else {
                        if (code !== null) alert("코드가 일치하지 않습니다.");
                        return; 
                    }
                }
            }

            // 자동 전송이면 매개변수로 받은 시간을, 수동이면 화면의 라디오버튼 값을 적용
            let selectedPeriod = "오후자습";
            if (isAuto && autoPeriod) {
                selectedPeriod = autoPeriod;
            } else {
                const periodRadios = document.getElementsByName('panelStudyPeriod');
                for (let radio of periodRadios) {
                    if (radio.checked) { selectedPeriod = radio.value; break; }
                }
            }

            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            const fullDateStr = `${year}-${month}-${date}`;
            const timeStr = `${hours}:${minutes}:${seconds}`;

            function getGradeData(gradePrefix) {
                let allStudents = [];
                for (let key in libraryData) {
                    const areaName = libraryData[key].name;
                    libraryData[key].seats.forEach((seat, index) => {
                        if (seat) {
                            let label = libraryData[key].seatLabels[index];
                            let displayLabel = String(label).includes('-') ? label : `${label}번`;
                            let seatLoc = displayLabel.startsWith(areaName) ? displayLabel : `${areaName} ${displayLabel}`;
                            allStudents.push({
                                id: String(seat.id), name: seat.name, displayLabel: displayLabel,
                                seatLocation: seatLoc, remark: seat.remark || '', areaKey: key, seatIndex: index
                            });
                        }
                    });
                }
                let filteredStudents = allStudents.filter(student => student.id.startsWith(gradePrefix));
                filteredStudents.sort((a, b) => {
                    if (a.areaKey !== b.areaKey) return a.areaKey.localeCompare(b.areaKey);
                    return a.displayLabel.localeCompare(b.displayLabel, 'ko', { numeric: true });
                });
                return filteredStudents;
            }

            const data1 = getGradeData('1');
            const data2 = getGradeData('2');
            const data3 = getGradeData('3');

            // 수동일 때만 팝업 안내 및 UI 변경 수행
            if (!isAuto) {
                alert(`전체 학년(${selectedPeriod}) 전송을 시작합니다.\n구글 서버 안정화를 위해 약 5초 정도 소요됩니다.\n완료 알림이 뜰 때까지 잠시만 기다려주세요.`);
            }

            const sendBtn = document.getElementById('btnExportAll');
            if (sendBtn && !isAuto) {
                sendBtn.disabled = true;
                sendBtn.innerText = "전체 전송 중... ⏳";
                sendBtn.style.backgroundColor = "#777";
            }

            function sendPayload(gradePrefix, students) {
                const payload = {
                    date: fullDateStr,
                    time: timeStr,
                    period: selectedPeriod,
                    grade: `${gradePrefix}학년`,
                    students: students
                };
                return fetch(GOOGLE_SHEET_URL, {
                    method: 'POST',
                    mode: 'no-cors', 
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(payload)
                });
            }

            // 1학년 -> 5초 딜레이 -> 2학년 -> 5초 딜레이 -> 3학년 전송
            sendPayload('1', data1)
                .then(() => new Promise(resolve => setTimeout(resolve, 5000))) 
                .then(() => sendPayload('2', data2))
                .then(() => new Promise(resolve => setTimeout(resolve, 5000)))
                .then(() => sendPayload('3', data3))
                .then(() => {
                    if (!isAuto) {
                        alert(`✅ 전체 학년 구글 시트 전송이 완벽하게 완료되었습니다!\n(전송 시각: ${timeStr})`);
                    }
                })
                .catch(error => {
                    if (!isAuto) alert("전송 중 네트워크 오류가 발생했습니다.\n" + error);
                })
                .finally(() => {
                    if (sendBtn && !isAuto) {
                        sendBtn.disabled = false;
                        sendBtn.innerText = "전체 학년 구글 시트로 전송";
                        sendBtn.style.backgroundColor = "#0f9d58";
                    }
                });
        }

        function updatePanel() {
            if (currentSpace.startsWith('list')) {
                displaySeatNum.innerText = '-';
                studentIdInput.value = '';
                studentNameInput.value = '';
                studentIdInput.disabled = true;
                studentNameInput.disabled = true;
                btnRegister.disabled = true;
                btnVacate.disabled = true;
                return;
            }

            studentIdInput.disabled = false;
            studentNameInput.disabled = false;
            btnRegister.disabled = false;
            btnVacate.disabled = false;

            if (selectedSeatIndex !== null) {
                let label = libraryData[currentSpace].seatLabels[selectedSeatIndex];
                displaySeatNum.innerText = label;
                
                const seatInfo = libraryData[currentSpace].seats[selectedSeatIndex];
                if (seatInfo) {
                    studentIdInput.value = seatInfo.id;
                    studentNameInput.value = seatInfo.name;
                } else {
                    studentIdInput.value = '';
                    studentNameInput.value = '';
                }
            } else {
                displaySeatNum.innerText = '-';
                studentIdInput.value = '';
                studentNameInput.value = '';
            }
        }

        function registerSeat() {
            if (currentSpace.startsWith('list')) return;
            if (selectedSeatIndex === null) {
                alert("먼저 지도에서 좌석을 선택해주세요.");
                return;
            }

            const studentId = studentIdInput.value.trim();
            const studentName = studentNameInput.value.trim();

            if (!studentId || !studentName) {
                alert("학번과 이름을 모두 입력해주세요.");
                return;
            }

            const idPattern = /^[1-3]0[1-9](0[1-9]|[1-9][0-9])$/;
            if (!idPattern.test(studentId)) {
                alert("학번을 잘못 입력했습니다.\n(예: 1학년 1반 1번 -> 10101)\n※ 첫자리는 1~3학년, 반은 01~09, 번호는 두 자리(01~99)로 정확히 입력해주세요.");
                studentIdInput.focus();
                return;
            }

            db.ref(`librarySeats/${currentSpace}/${selectedSeatIndex}`).set({
                id: studentId, 
                name: studentName,
                remark: "" 
            });

            alert("좌석 등록이 완료되었습니다.");
            studentIdInput.value = '';
            studentNameInput.value = '';
        }

        function vacateSeat() {
            if (currentSpace.startsWith('list')) return;
            if (selectedSeatIndex === null || !libraryData[currentSpace].seats[selectedSeatIndex]) {
                alert("퇴실 처리할 사용 중인 좌석을 선택해주세요.");
                return;
            }
            if (confirm("해당 좌석을 퇴실 처리하시겠습니까?")) {
                db.ref(`librarySeats/${currentSpace}/${selectedSeatIndex}`).remove();
                selectedSeatIndex = null;
                updatePanel();
            }
        }

       function resetAllSeats(isAuto = false) {
            // 수동 클릭일 때만 선생님 암호와 진짜 지울 것인지 묻는 경고창을 띄웁니다.
            if (!isAuto) {
                if (!isTeacherAuthenticated) {
                    const code = prompt("선생님 전용 메뉴입니다.\n관리자 코드를 입력하세요:");
                    if (code === "96123") {
                        isTeacherAuthenticated = true;
                        alert("인증되었습니다.");
                    } else {
                        if (code !== null) alert("코드가 일치하지 않습니다.");
                        return; 
                    }
                }

                if (!confirm("⚠️ 주의: 모든 학년과 구역의 좌석 데이터가 완전히 삭제됩니다.\n정말로 전체 좌석을 초기화하시겠습니까?")) {
                    return; // 취소를 누르면 중단
                }
            }

            // Firebase 데이터베이스에서 모든 좌석 정보 삭제
            db.ref('librarySeats').remove()
                .then(() => {
                    // 수동일 때만 완료 알림창을 띄움
                    if (!isAuto) {
                        alert("전체 좌석이 성공적으로 초기화되었습니다.");
                    }
                    selectedSeatIndex = null;
                    updatePanel(); // 화면(UI) 업데이트
                })
                .catch((error) => {
                    if (!isAuto) {
                        alert("초기화 중 오류가 발생했습니다: " + error);
                    } else {
                        console.error("자동 초기화 중 오류 발생: ", error);
                    }
                });
        }
        renderTabs();
    </script>
</body>
</html>
